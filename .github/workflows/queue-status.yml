name: PR Test (AMD) queue status

# Rewrites the pending "AMD PR test" status of every PR test still waiting or
# running with its place in the GPU runners' queue ("3/14 done; running X; 9
# waiting, ~N jobs ahead"), so a run that waits most of a day for the two runners
# does not look hung. It also cancels the scheduled nightly run when a GPU job of
# it has waited for a runner more than 12 hours (NIGHTLY_MAX_QUEUE_HOURS) and none
# of its jobs is running, so the nightly ends the day it starts. See scripts/ci/queue_status.py. Only GitHub-hosted runners; it reads
# job lists, writes commit statuses and cancels runs, nothing from a PR runs.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-test-amd-queue-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # write: cancel a nightly run stuck in the queue
      actions: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Update the statuses
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/queue_status.py
