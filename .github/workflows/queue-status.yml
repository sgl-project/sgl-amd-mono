name: PR Test (AMD) queue status

# Rewrites the pending "AMD PR test" status of every PR test still waiting or
# running with its place in the GPU runners' queue ("3/14 done; running X; 9
# waiting, ~N jobs ahead"), so a run that waits most of a day for the two runners
# does not look hung. See scripts/ci/queue_status.py. Only GitHub-hosted runners;
# it reads job lists and writes commit statuses, nothing from a PR runs.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-test-amd-queue-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Update the statuses
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/queue_status.py
